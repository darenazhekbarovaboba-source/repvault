<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REPVAULT · Shopping Toolkit</title>
  <meta name="description" content="REPVAULT is a premium toolkit for agent shoppers: QC organizer, package tracker, size converter, shipping estimator, link converter and product organizer.">
  <meta name="theme-color" content="#080808">
  <meta property="og:type" content="website">
  <meta property="og:title" content="REPVAULT · Shopping Toolkit">
  <meta property="og:description" content="QC photos, packages, sizes, shipping estimates, agent links and saved products in one private vault.">
  <meta property="og:url" content="https://darenazhekbarovaboba-source.github.io/repvault/">
  <meta property="og:image" content="https://darenazhekbarovaboba-source.github.io/repvault/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand brand--top" href="#/dashboard" aria-label="REPVAULT home"><span class="brand-mark" aria-hidden="true">R</span><span class="brand-word">REPVAULT</span></a>
    <span class="topbar-spacer"></span>
  </header>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <a class="brand" href="#/dashboard" aria-label="REPVAULT home"><span class="brand-mark" aria-hidden="true">R</span><span class="brand-word">REPVAULT</span></a>
    <p class="brand-sub">Shopping toolkit</p>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="fx-chip" id="fx-chip" aria-live="polite">Loading rate…</div>
    </div>
  </aside>

  <main id="main" class="main" tabindex="-1">
    <div id="view" class="view"></div>
    <footer class="footer">
      <p>REPVAULT · Your data stays in this browser (localStorage). Nothing is uploaded.</p>
      <p>Estimates are estimates. Live tracking is not fetched; carrier links open the official pages. Exchange rates by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a>.</p>
    </footer>
  </main>

  <p class="sr-only" id="route-announcer" aria-live="polite" aria-atomic="true"></p>
  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <form method="dialog" class="modal-inner" id="modal-form">
      <div class="modal-head">
        <h2 id="modal-title" class="modal-title"></h2>
        <button class="icon-btn" type="button" data-modal-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </form>
  </dialog>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <div class="lightbox-inner">
      <button class="icon-btn lb-close" type="button" id="lb-close" aria-label="Close viewer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="icon-btn lb-nav lb-prev" type="button" id="lb-prev" aria-label="Previous photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <figure class="lb-figure"><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
      <button class="icon-btn lb-nav lb-next" type="button" id="lb-next" aria-label="Next photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </dialog>

  <noscript><p class="noscript">REPVAULT needs JavaScript to run.</p></noscript>

  <script src="js/core.js"></script>
  <script src="js/links.js"></script>
  <script src="js/tools/dashboard.js"></script>
  <script src="js/tools/qc.js"></script>
  <script src="js/tools/packages.js"></script>
  <script src="js/tools/sizes.js"></script>
  <script src="js/tools/shipping.js"></script>
  <script src="js/tools/converter.js"></script>
  <script src="js/tools/products.js"></script>
  <script src="js/tools/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
